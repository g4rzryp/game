<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>game i guess</title>
    <style>
        :root {
            --bg: #0a0b10; --side: #11141d; --card: #161a23; --text: #d1d5db; --mid: #ffea00;
            --accent: #3b82f6; --border: #2d333d; --l: #f87171; --w: #34d399;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        body.custom-bg { background-size: cover; background-position: center; background-attachment: fixed; }
        body.custom-bg::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); z-index: 0; }

        .main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; z-index: 1; }
        .container { background: var(--card); padding: 2rem; border-radius: 15px; width: 100%; max-width: 800px; text-align: center; border: 1px solid var(--border); display: none; max-height: 85vh; overflow-y: auto;}
        .container.active { display: block; }

        .srt-btn { background: #1c1f26; border: 1px solid var(--border); color: var(--text); text-align: center; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; width: 95%; transition: 0.2s; }
        .srt-btn:hover { border-color: var(--accent); color: var(--accent); }
    </style>
</head>

<body>
    <div class="main">
        <div id="home" class="container active">
            <h1>sum game</h1>
            <p>bum</p>
            <button class="srt-btn" onclick="loadGame">play</button>
        </div>

        <div id="game-view" class="container">
            <h2>budget flappy bird</h2>
    </div>
    <script>
        window.addEventListener('keydown', (space) => {
        });

        function loadGame {
            showView('game-view'); activeG = id; const config = grammar[id];
        }
        function goHome {
            showView('home-view'); activeG = id; const config = grammar[id];
        }
    </script>
</body>
</html>
